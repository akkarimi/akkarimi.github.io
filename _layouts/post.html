---
layout: default
---
<article class="container split">
  <div class="main-col">
    <p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="prose">
      {{ content }}
    </div>
    <p class="section-more"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
  </div>
</article>
