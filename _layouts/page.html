---
layout: default
---
{%- comment -%} Inner page: title + content in the reading column. Front matter: title, lead (optional). {%- endcomment -%}
<div class="container split">
  <div class="main-col">
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    {{ content }}
  </div>
</div>
