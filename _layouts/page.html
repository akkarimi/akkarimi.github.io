---
layout: default
---
{%- comment -%} Standard inner page: title block + content. Front matter: title, lead (optional intro line). {%- endcomment -%}
<div class="container">
  <header class="page-head">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</div>
