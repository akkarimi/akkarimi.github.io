---
layout: default
---
{%- comment -%} Standard inner page: tinted title band + content. Front matter: title, lead (optional intro line). {%- endcomment -%}
<div class="page-band">
  <header class="container page-head">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </header>
</div>
<div class="container page-body">
  {{ content }}
</div>
