      month = 12-
    }

- title: "AEDA: An Easier Data Augmentation Technique for Text Classification"
  authors: "A Karimi, L Rossi, A Prati"
  venue: "Findings of EMNLP"
  badge: "EMNLP Findings"
  year: 2021
  type: findings
  topics: [augmentation]
  selected: true
  summary: >-
    AEDA inserts punctuation marks randomly into text — simpler than EDA, lossless, and
    consistently superior across five classification datasets.
  links:
    pdf: https://aclanthology.org/2021.findings-emnlp.234.pdf
    doi: 10.18653/v1/2021.findings-emnlp.234
  abstract: >-
    This paper proposes AEDA (An Easier Data Augmentation) technique to help improve the
    performance on text classification tasks. AEDA includes only random insertion of
    punctuation marks into the original text. This is an easier technique to implement
    for data augmentation than EDA method (Wei and Zou, 2019) with which we compare our
    results. In addition, it keeps the order of the words while changing their positions
    in the sentence leading to a better generalized performance. Furthermore, the
    deletion operation in EDA can cause loss of information which, in turn, misleads the
    network, whereas AEDA preserves all the input information. Following the baseline,
    we perform experiments on five different datasets for text classification. We show
    that using the AEDA-augmented data for training, the models show superior
    performance compared to using the EDA-augmented data in all five datasets. The
    source code will be made available for further study and reproduction of the
    results.
  bibtex: |
    @inproceedings{karimi2021aeda,
      title = {{AEDA}: An Easier Data Augmentation Technique for Text Classification},
      author = {Karimi, Akbar and Rossi, Leonardo and Prati, Andrea},
      booktitle = {Findings of the {A}ssociation for {C}omputational {L}inguistics: {EMNLP} 2021},
      pages = {2748--2754},
      year = {2021},
      month = nov,
      address = {Punta Cana, Dominican Republic},
      publisher = {Association for Computational Linguistics},
      doi = {10.18653/v1/2021.findings-emnlp.234},
