    }

- title: "Exploring Robustness of Multilingual LLMs on Real-World Noisy Data"
  authors: "A Aliakbarzadeh, L Flek, A Karimi"
  venue: "Eighth Widening NLP Workshop (WiNLP 2024) Phase II"
  badge: "WiNLP"
  year: 2024
  type: workshop
  topics: [robustness, multilingual]
  selected: false
  summary: >-
    We study how real-world spelling mistakes from Wikipedia edit history affect 9
    multilingual language models across NLI, NER, and intent classification in 6
    languages, finding a 2.3 to 4.3 point performance gap, with mT5 models the most
    robust.
  links:
    pdf: https://arxiv.org/pdf/2501.08322
  abstract: >-
    Large Language Models (LLMs) are trained on Web data that might contain spelling
    errors made by humans. But do they become robust to similar real-world noise? In
    this paper, we investigate the effect of real-world spelling mistakes on the
    performance of 9 language models, with parameters ranging from 0.2B to 13B, in 3
    different NLP tasks, namely Natural Language Inference (NLI), Name Entity
    Recognition (NER), and Intent Classification (IC). We perform our experiments on 6
    different languages and build a dictionary of real-world noise for them using the
    Wikipedia edit history. We show that the performance gap of the studied models on
    the clean and noisy test data averaged across all the datasets and languages ranges
    from 2.3 to 4.3 absolute percentage points. In addition, mT5 models, in general,
    show more robustness compared to BLOOM, Falcon, and BERT-like models. In particular,
    mT5 (13B), was the most robust on average overall, across the 3 tasks, and in 4 of
    the 6 languages.
  bibtex: |
    @misc{aliakbarzadeh2025exploring,
      title = {Exploring Robustness of Multilingual LLMs on Real-World Noisy Data},
      author = {Amirhossein Aliakbarzadeh and Lucie Flek and Akbar Karimi},
      year = {2025},
      eprint = {2501.08322},
      archiveprefix = {arXiv},
      primaryclass = {cs.CL},
      url = {https://arxiv.org/abs/2501.08322}
    }

- title: "Do Multilingual Large Language Models Mitigate Stereotype Bias?"
  authors: "S Nie, M Fromm, C Welch, R Görge, A Karimi, J Plepi, N Mowmita, N Flores-Herr, M Ali, L Flek"
  venue: "C3NLP Workshop @ ACL"
  badge: "ACL Workshop"
  year: 2024
  type: workshop
  topics: [multilingual]
  selected: false
  summary: >-
    We investigate the effect of multilingual training on bias mitigation by
    systematically training six LLMs of identical size (2.6B parameters): five
    monolingual and one multilingual model, showing that multilingual training
    consistently reduces bias while improving prediction accuracy.
  links:
    pdf: https://aclanthology.org/2024.c3nlp-1.6.pdf
    doi: 10.18653/v1/2024.c3nlp-1.6
  abstract: >-
    While preliminary findings indicate that multilingual LLMs exhibit reduced bias
    compared to monolingual ones, a comprehensive understanding of the effect of
    multilingual training on bias mitigation, is lacking. This study addresses this gap
    by systematically training six LLMs of identical size (2.6 B parameters) and
    architecture: five monolingual models (English, German, French, Italian, and
    Spanish) and one multilingual model trained on an equal distribution of data across
    these languages, all using publicly available data. To ensure robust evaluation,
    standard bias benchmarks were automatically translated into the five target
    languages and verified for both translation quality and bias preservation by human
    annotators. Our results consistently demonstrate that multilingual training
    effectively mitigates bias. Moreover, we observe that multilingual models achieve
    not only lower bias but also superior prediction accuracy when compared to
    monolingual models with the same amount of training data, model architecture, and
    size.
  bibtex: |
    @inproceedings{nie2024multilingual,
      title = {Do Multilingual Large Language Models Mitigate Stereotype Bias?},
      author = {Nie, Shangrui and Fromm, Michael and Welch, Charles and G{\"o}rge, Rebekka and Karimi, Akbar and Plepi, Joan and Mowmita, Nazia and Flores-Herr, Nicolas and Ali, Mehdi and Flek, Lucie},
      booktitle = {Proceedings of the 2nd Workshop on Cross-Cultural Considerations in {NLP}},
      pages = {65--83},
