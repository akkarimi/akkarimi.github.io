  summary: >-
    We describe the Colliding with Adversaries challenge, with tasks on generating
    adversarial examples against a jet-classification model and on building models
    robust to unseen attacks, using simulated CMS collision data.
  links:
    pdf: https://link.springer.com/chapter/10.1007/978-3-032-19108-3_36
    doi: 10.1007/978-3-032-19108-3_36
    website: https://collidingadversaries.github.io/
  abstract: >-
    The Colliding with Adversaries challenge on robust learning in High Energy Physics
    was held at ECML PKDD 2025. It consisted of two tasks: generating adversarial
    examples to attack a deep learning model, and developing a model that is robust to
    unseen adversarial attacks while maintaining strong performance on clean data. Both
    tasks used a tabular dataset derived from two simulated CMS collision processes at
    the LHC, with 87 continuous features per sample, framed as binary classification
    between jets from top-quark pairs (TTJets) and W-boson jets. More details are
    available on the <a href="https://collidingadversaries.github.io/">challenge
    website</a>.
