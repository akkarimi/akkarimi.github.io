- title: "Uniparma at SemEval-2021 Task 5: Toxic Spans Detection Using CharacterBERT and Bag-of-Words Model"
  authors: "A Karimi, L Rossi, A Prati"
  venue: "SemEval 2021"
  badge: "SemEval"
  year: 2021
  type: workshop
  topics: [sentiment]
  selected: false
  summary: >-
    We detect toxic spans by combining CharacterBERT, which handles misspelled toxic
    words through character-level embeddings, with a bag-of-words method that ensures
    frequently used toxic words are labeled.
  links:
    pdf: https://aclanthology.org/2021.semeval-1.25.pdf
    doi: 10.18653/v1/2021.semeval-1.25
  abstract: >-
    With the ever-increasing availability of digital information, toxic content is also
    on the rise. Therefore, the detection of this type of language is of paramount
    importance. We tackle this problem utilizing a combination of a state-of-the-art
    pre-trained language model (CharacterBERT) and a traditional bag-of-words technique.
    Since the content is full of toxic words that have not been written according to
    their dictionary spelling, attendance to individual characters is crucial.
    Therefore, we use CharacterBERT to extract features based on the word characters. It
    consists of a CharacterCNN module that learns character embeddings from the context.
    These are, then, fed into the well-known BERT architecture. The bag-of-words method,
    on the other hand, further improves upon that by making sure that some frequently
    used toxic words get labeled accordingly. With a ~4 percent difference from the
    first team, our system ranked 36th in the competition. The code is available for
    further research and reproduction of the results.
  bibtex: |
    @inproceedings{karimi2021uniparma,
      title = {{U}ni{P}arma at {S}em{E}val-2021 Task 5: Toxic Spans Detection Using {C}haracter{BERT} and Bag-of-Words Model},
      author = {Karimi, Akbar and Rossi, Leonardo and Prati, Andrea},
      booktitle = {Proceedings of the 15th {I}nternational {W}orkshop on {S}emantic {E}valuation ({S}em{E}val-2021)},
      pages = {220--224},
      year = {2021},
      month = aug,
      address = {Online},
      publisher = {Association for Computational Linguistics},
      doi = {10.18653/v1/2021.semeval-1.25},
      url = {https://aclanthology.org/2021.semeval-1.25/}
    }

- title: "A Novel Region of Interest Extraction Layer for Instance Segmentation"
  authors: "L Rossi, A Karimi, A Prati"
  venue: "ICPR 2020"
  badge: "ICPR"
  year: 2020
  type: conference
  topics: [vision]
  selected: false
  summary: >-
    We propose GRoIE, a Generic RoI Extractor that uses all FPN layers with non-local
    blocks and attention, integrating seamlessly into two-stage architectures and
    improving detection by up to 1.1% AP and instance segmentation by 1.7% AP.
  links:
    pdf: https://arxiv.org/pdf/2004.13665
    doi: 10.1109/icpr48806.2021.9412258
  abstract: >-
    Given the wide diffusion of deep neural network architectures for computer vision
    tasks, several new applications are nowadays more and more feasible. Among them, a
    particular attention has been recently given to instance segmentation, by exploiting
    the results achievable by two-stage networks (such as Mask R-CNN or Faster R-CNN),
    derived from R-CNN. In these complex architectures, a crucial role is played by the
    Region of Interest (RoI) extraction layer, devoted to extracting a coherent subset
    of features from a single Feature Pyramid Network (FPN) layer attached on top of a
    backbone. This paper is motivated by the need to overcome the limitations of
    existing RoI extractors which select only one (the best) layer from FPN. Our
    intuition is that all the layers of FPN retain useful information. Therefore, the
    proposed layer (called Generic RoI Extractor - GRoIE) introduces non-local building
    blocks and attention mechanisms to boost the performance. A comprehensive ablation
    study at component level is conducted to find the best set of algorithms and
    parameters for the GRoIE layer. Moreover, GRoIE can be integrated seamlessly with
    every two-stage architecture for both object detection and instance segmentation
    tasks. Therefore, the improvements brought about by the use of GRoIE in different
    state-of-the-art architectures are also evaluated. The proposed layer leads up to
    gain a 1.1% AP improvement on bounding box detection and 1.7% AP improvement on
    instance segmentation.
  bibtex: |
    @inproceedings{rossi2021novel,
      title = {A Novel Region of Interest Extraction Layer for Instance Segmentation},
      author = {Rossi, Leonardo and Karimi, Akbar and Prati, Andrea},
      booktitle = {2020 25th International Conference on Pattern Recognition (ICPR)},
      pages = {2203--2209},
      year = {2021},
      month = jan,
      publisher = {IEEE},
      doi = {10.1109/icpr48806.2021.9412258},
      url = {https://doi.org/10.1109/icpr48806.2021.9412258}
    }

- title: "Adversarial Training for Aspect-Based Sentiment Analysis with BERT"
  authors: "A Karimi, L Rossi, A Prati"
  venue: "ICPR"
  badge: "ICPR"
  year: 2020
  type: conference
  topics: [robustness, sentiment]
  selected: true
  summary: >-
    We propose BERT Adversarial Training (BAT), a novel architecture that applies
    adversarial training to Aspect Extraction and Aspect Sentiment Classification,
    outperforming both general and domain post-trained BERT — the first study of its
    kind in ABSA.
  links:
    pdf: https://arxiv.org/pdf/2001.11316
    doi: 10.1109/icpr48806.2021.9412167
  abstract: >-
    Aspect-Based Sentiment Analysis (ABSA) studies the extraction of sentiments and
    their targets. Collecting labeled data for this task in order to help neural
    networks generalize better can be laborious and time-consuming. As an alternative,
    similar data to the real-world examples can be produced artificially through an
    adversarial process which is carried out in the embedding space. Although these
    examples are not real sentences, they have been shown to act as a regularization
    method which can make neural networks more robust. In this work, we finetune the
    general purpose BERT and domain specific post-trained BERT (BERT-PT) using
    adversarial training. After improving the results of post-trained BERT with
    different hyperparameters, we propose a novel architecture called BERT Adversarial
    Training (BAT) to utilize adversarial training for the two major tasks of Aspect
    Extraction and Aspect Sentiment Classification in sentiment analysis. The proposed
    model outperforms the general BERT as well as the in-domain post-trained BERT in
    both tasks. To the best of our knowledge, this is the first study on the application
    of adversarial training in ABSA.
  bibtex: |
    @inproceedings{karimi2021adversarial,
      title = {Adversarial Training for Aspect-Based Sentiment Analysis with BERT},
      author = {Karimi, Akbar and Rossi, Leonardo and Prati, Andrea},
      booktitle = {2020 25th International Conference on Pattern Recognition (ICPR)},
      pages = {8797--8803},
      year = {2021},
      month = jan,
      publisher = {IEEE},
      doi = {10.1109/icpr48806.2021.9412167},
      url = {https://doi.org/10.1109/icpr48806.2021.9412167}
    }

- title: "Extracting an English-Persian Parallel Corpus from Comparable Corpora"
  authors: "A Karimi, E Ansari, BS Bigham"
  venue: "LREC 2018"
  badge: "LREC"
  year: 2018
  type: conference
  topics: [mt]
  selected: false
  summary: >-
    We propose a bidirectional method to extract parallel sentences from
    document-aligned English and Persian Wikipedia, producing a corpus of about 200,000
    sentences that improves statistical machine translation quality.
  links:
    pdf: https://aclanthology.org/L18-1549.pdf
  abstract: >-
    Parallel data are an important part of a reliable Statistical Machine Translation
    (SMT) system. The more of these data are available, the better the quality of the
    SMT system. However, for some language pairs such as Persian-English, parallel
    sources of this kind are scarce. In this paper, a bidirectional method is proposed
    to extract parallel sentences from English and Persian document aligned Wikipedia.
    Two machine translation systems are employed to translate from Persian to English
    and the reverse after which an IR system is used to measure the similarity of the
    translated sentences. Adding the extracted sentences to the training data of the
    existing SMT systems is shown to improve the quality of the translation.
    Furthermore, the proposed method slightly outperforms the one-directional approach.
    The extracted corpus consists of about 200,000 sentences which have been sorted by
    their degree of similarity calculated by the IR system and is freely available for
    public access on the Web.
  bibtex: |
    @inproceedings{karimi2018extracting,
      title = {Extracting an {E}nglish-{P}ersian Parallel Corpus from Comparable Corpora},
      author = {Karimi, Akbar and Ansari, Ebrahim and Sadeghi Bigham, Bahram},
      booktitle = {Proceedings of the Eleventh International Conference on Language Resources and Evaluation ({LREC} 2018)},
      year = {2018},
      month = may,
      address = {Miyazaki, Japan},
      publisher = {European Language Resources Association (ELRA)},
      url = {https://aclanthology.org/L18-1549/}
    }
