    }

- title: "Enforcing Fundamental Relations via Adversarial Attacks on Input Parameter Correlations"
  authors: "L Flek, PA Jung, A Karimi, T Saala, A Schmidt, M Schott, P Soldin, C Wiebusch"
  venue: "Computing and Software for Big Science"
  badge: "CSBS"
  year: 2025
  type: journal
  topics: [science, robustness]
  selected: false
  summary: >-
    We present the Random Distribution Shuffle Attack (RDSA), which targets correlations
    between observables rather than individual features, and show that adversarial
    training with it improves classification on particle physics and five other tasks.
  links:
    pdf: https://link.springer.com/content/pdf/10.1007/s41781-025-00148-1.pdf
    doi: 10.1007/s41781-025-00148-1
  abstract: >-
    Correlations between input parameters play a crucial role in many scientific
    classification tasks, since these are often related to fundamental laws of nature.
    For example, in high energy physics, one common deep learning use-case is the
    classification of signal and background processes in particle collisions. In many
    such cases, the fundamental principles of the correlations between observables are
    often better understood than the actual distributions of the observables themselves.
    In this work, we present a new adversarial attack algorithm called Random
    Distribution Shuffle Attack (RDSA), emphasizing the correlations between observables
    in the network rather than individual feature characteristics. Correct application
    of the proposed novel attack can result in a significant improvement in
    classification performance—particularly in the context of data augmentation—when
    using the generated adversaries within adversarial training. Given that correlations
    between input features are also crucial in many other disciplines, we demonstrate
    the RDSA effectiveness on six classification tasks, including two particle collision
    challenges (using CERN Open Data), hand-written digit recognition (MNIST784), human
    activity recognition (HAR), weather forecasting (Rain in Australia), and ICU patient
    mortality (MIMIC-IV), demonstrating a general use case beyond fundamental physics
    for this new type of adversarial attack algorithm.
  bibtex: |
    @article{flek2025enforcing,
      title = {Enforcing Fundamental Relations via Adversarial Attacks on Input Parameter Correlations},
      author = {Flek, Lucie and Jung, Philipp Alexander and Karimi, Akbar and Saala, Timo and Schmidt, Alexander and Schott, Matthias and Soldin, Philipp and Wiebusch, Christopher},
      journal = {Computing and Software for Big Science},
      volume = {9},
      number = {1},
      year = {2025},
      month = nov,
      publisher = {Springer Science and Business Media LLC},
      doi = {10.1007/s41781-025-00148-1},
      url = {https://doi.org/10.1007/s41781-025-00148-1}
    }

