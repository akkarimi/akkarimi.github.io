- title: "ArithmAttack: Evaluating Robustness of LLMs to Noisy Context in Math Problem Solving"
  authors: "Z Ul Abedin, S Qamar, L Flek, A Karimi"
  venue: "LLMSEC Workshop @ ACL"
  badge: "ACL Workshop"
  year: 2025
  type: workshop
  topics: [robustness]
  selected: true
  summary: >-
    We propose ArithmAttack to examine how robust LLMs are when they encounter noisy
    prompts containing extra punctuation marks — an attack that causes no information
    loss yet consistently degrades performance across eight models.
  links:
    pdf: https://aclanthology.org/2025.llmsec-1.5.pdf
    code: https://github.com/caisa-lab/ArithmAttack
  abstract: >-
    While Large Language Models (LLMs) have shown impressive capabilities in math
    problem-solving tasks, their robustness to noisy inputs is not well-studied. We
    propose ArithmAttack to examine how robust the LLMs are when they encounter noisy
    prompts that contain extra noise in the form of punctuation marks. While being easy
    to implement, ArithmAttack does not cause any information loss since words are not
    added or deleted from the context. We evaluate the robustness of eight LLMs,
    including LLama3, Mistral, Mathstral, and DeepSeek on noisy GSM8K and MultiArith
    datasets. Our experiments suggest that all the studied models show vulnerability to
    such noise, with more noise leading to poorer performances.
