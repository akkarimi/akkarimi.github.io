- title: "Self-Balanced R-CNN for Instance Segmentation"
  authors: "L Rossi, A Karimi, A Prati"
  venue: "JVCIR"
  badge: "JVCIR"
  year: 2022
  type: journal
  topics: [vision]
  selected: false
  summary: >-
    We propose SBR-CNN, an evolution of HTC with loop mechanisms for box and mask
    refinement and an improved GRoIE, addressing IoU and feature-level imbalances and
    reaching 45.3% / 41.5% AP on COCO with a ResNet-50 backbone.
  links:
    pdf: https://arxiv.org/pdf/2404.16633
    doi: 10.1016/j.jvcir.2022.103595
  abstract: >-
    Current state-of-the-art two-stage models on instance segmentation task suffer from
    several types of imbalances. In this paper, we address the Intersection over the
    Union (IoU) distribution imbalance of positive input Regions of Interest (RoIs)
    during the training of the second stage. Our Self-Balanced R-CNN (SBR-CNN), an
    evolved version of the Hybrid Task Cascade (HTC) model, brings brand new loop
    mechanisms of bounding box and mask refinements. With an improved Generic RoI
    Extraction (GRoIE), we also address the feature-level imbalance at the Feature
    Pyramid Network (FPN) level, originated by a non-uniform integration between low-
    and high-level features from the backbone layers. In addition, the redesign of the
    architecture heads toward a fully convolutional approach with FCC further reduces
    the number of parameters and obtains more clues to the connection between the task
    to solve and the layers used. Moreover, our SBR-CNN model shows the same or even
    better improvements if adopted in conjunction with other state-of-the-art models. In
    fact, with a lightweight ResNet-50 as backbone, evaluated on COCO minival 2017
    dataset, our model reaches 45.3% and 41.5% AP for object detection and instance
    segmentation, with 12 epochs and without extra tricks.
  bibtex: |
    @article{rossi2022self,
      title = {Self-Balanced R-CNN for instance segmentation},
      author = {Rossi, Leonardo and Karimi, Akbar and Prati, Andrea},
      journal = {Journal of Visual Communication and Image Representation},
      volume = {87},
      pages = {103595},
      year = {2022},
      month = aug,
      publisher = {Elsevier BV},
      doi = {10.1016/j.jvcir.2022.103595},
      url = {https://doi.org/10.1016/j.jvcir.2022.103595}
    }

- title: "Aspect-Based Emotion Analysis and Multimodal Coreference: A Case Study of Customer Comments on Adidas Instagram Posts"
  authors: "L De Bruyne, A Karimi, O De Clercq, A Prati, V Hoste"
  venue: "LREC 2022"
  badge: "LREC"
  year: 2022
  type: conference
  topics: [sentiment]
  selected: false
  summary: >-
    We present a multimodal dataset of 4,900 comments on 175 Instagram images annotated
    for aspect-based emotion analysis, and find that aspect and emotion classification
    benefit little from multimodal coreference resolution.
  links:
    pdf: https://aclanthology.org/2022.lrec-1.61.pdf
  abstract: >-
    While aspect-based sentiment analysis of user-generated content has received a lot
    of attention in the past years, emotion detection at the aspect level has been
    relatively unexplored. Moreover, given the rise of more visual content on social
    media platforms, we want to meet the ever-growing share of multimodal content. In
    this paper, we present a multimodal dataset for Aspect-Based Emotion Analysis
    (ABEA). Additionally, we take the first steps in investigating the utility of
    multimodal coreference resolution in an ABEA framework. The presented dataset
    consists of 4,900 comments on 175 images and is annotated with aspect and emotion
    categories and the emotional dimensions of valence and arousal. Our preliminary
    experiments suggest that ABEA does not benefit from multimodal coreference
    resolution, and that aspect and emotion classification only requires textual
    information. However, when more specific information about the aspects is desired,
    image recognition could be essential.
