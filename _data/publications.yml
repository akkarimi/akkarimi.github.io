- title: "EDAudio: Easy Data Augmentation for Dialectal Audio"
  authors: "L Fischbach, A Karimi, A Lameli, L Flek"
  venue: "RANLP 2025"
  badge: "RANLP"
  year: 2025
  type: conference
  topics: [augmentation, dialects]
  selected: false
  summary: >-
    We evaluate lightweight audio augmentation techniques on recordings from 20 German
    dialects, finding that frequency-based methods, especially frequency masking,
    consistently help while time masking or speaker-based insertion can hurt.
  links:
    pdf: https://aclanthology.org/2025.ranlp-1.44.pdf
  abstract: >-
    We investigate lightweight and easily applicable data augmentation techniques for
    dialectal audio classification. We evaluate four main methods, namely shifting
    pitch, interval removal, background noise insertion and interval swap as well as
    several subvariants on recordings from 20 German dialects. Each main method is
    tested across multiple hyperparameter combinations, including augmentation length,
    coverage ratio and number of augmentations per original sample. Our results show
    that frequency-based techniques, particularly frequency masking, consistently yield
    performance improvements, while others such as time masking or speaker-based
    insertion can negatively affect the results. Our comparative analysis identifies
    which augmentations are most effective under realistic conditions, offering simple
    and efficient strategies to improve dialectal speech classification.
  bibtex: |
    @inproceedings{fischbach2025edaudio,
      title = {{EDA}udio: Easy Data Augmentation for Dialectal Audio},
      author = {Fischbach, Lea and Karimi, Akbar and Lameli, Alfred and Flek, Lucie},
      booktitle = {Proceedings of the 15th International Conference on Recent Advances in Natural Language Processing - Natural Language Processing in the Generative {AI} Era},
      pages = {363--368},
      year = {2025},
      month = sep,
      address = {Varna, Bulgaria},
      publisher = {INCOMA Ltd., Shoumen, Bulgaria},
      url = {https://aclanthology.org/2025.ranlp-1.44/}
    }

- title: "Improving Low-Resource Dialect Classification Using Retrieval-based Voice Conversion"
  authors: "L Fischbach, A Karimi, C Kleen, A Lameli, L Flek"
  venue: "Interspeech 2025"
  badge: "Interspeech"
  year: 2025
  type: conference
  topics: [dialects, augmentation]
  selected: true
  summary: >-
    We use Retrieval-based Voice Conversion to map recordings to a single target
    speaker, reducing speaker variability so models focus on dialectal features,
    improving low-resource German dialect classification alone and combined with other
    augmentations.
  links:
    pdf: https://www.isca-archive.org/interspeech_2025/fischbach25_interspeech.pdf
    doi: 10.21437/interspeech.2025-1017
  abstract: >-
    Deep learning models for dialect identification are often limited by the scarcity of
    dialectal data. To address this challenge, we propose to use Retrieval-based Voice
    Conversion (RVC) as an effective data augmentation method for a low-resource German
    dialect classification task. By converting audio samples to a uniform target
    speaker, RVC minimizes speaker-related variability, enabling models to focus on
    dialect-specific linguistic and phonetic features. Our experiments demonstrate that
    RVC enhances classification performance when utilized as a standalone augmentation
    method. Furthermore, combining RVC with other augmentation methods such as frequency
    masking and segment removal leads to additional performance gains, highlighting its
    potential for improving dialect classification in low-resource scenarios.
  bibtex: |
    @inproceedings{fischbach2025improving,
      title = {Improving Low-Resource Dialect Classification Using Retrieval-based Voice Conversion},
      author = {Fischbach, Lea and Karimi, Akbar and Kleen, Caroline and Lameli, Alfred and Flek, Lucie},
      booktitle = {Interspeech 2025},
      pages = {2780--2784},
      year = {2025},
      month = aug,
      publisher = {ISCA},
      doi = {10.21437/interspeech.2025-1017},
      url = {https://doi.org/10.21437/interspeech.2025-1017}
    }

- title: "Multi-Hop Reasoning for Question Answering with Hyperbolic Representations"
  authors: "S Welz, L Flek, A Karimi"
  venue: "Findings of ACL"
  badge: "ACL Findings"
  year: 2025
  type: findings
  topics: [reasoning]
  selected: false
  summary: >-
    Through a simple integration of hyperbolic representations with an encoder-decoder
    model, we perform a controlled and comprehensive set of experiments to compare the
    capacity of hyperbolic space versus Euclidean space in multi-hop reasoning.
  links:
    pdf: https://aclanthology.org/2025.findings-acl.908.pdf
    doi: 10.18653/v1/2025.findings-acl.908
  abstract: >-
    Hyperbolic representations are effective in modeling knowledge graph data which is
    prevalently used to facilitate multi-hop reasoning. However, a rigorous and detailed
    comparison of the two spaces for this task is lacking. In this paper, through a
    simple integration of hyperbolic representations with an encoder-decoder model, we
    perform a controlled and comprehensive set of experiments to compare the capacity of
    hyperbolic space versus Euclidean space in multi-hop reasoning. Our results show
    that the former consistently outperforms the latter across a diverse set of
    datasets. In addition, through an ablation study, we show that a learnable curvature
    initialized with the delta hyperbolicity of the utilized data yields superior
    results to random initializations. Furthermore, our findings suggest that hyperbolic
    representations can be significantly more advantageous when the datasets exhibit a
    more hierarchical structure.
  bibtex: |
    @inproceedings{welz2025multi,
      title = {Multi-Hop Reasoning for Question Answering with Hyperbolic Representations},
      author = {Welz, Simon and Flek, Lucie and Karimi, Akbar},
