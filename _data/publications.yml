  type: workshop
  topics: [augmentation, biomedical]
  selected: false
  summary: >-
    We introduce a counterfactual data augmentation method based on verb replacement for
    identifying medical claims, yielding significant relative improvement on the
    minority class compared to three other augmentation techniques.
  links:
    pdf: https://aclanthology.org/2023.semeval-1.292.pdf
    doi: 10.18653/v1/2023.semeval-1.292
  abstract: >-
    Class imbalance problem can cause machine learning models to produce an undesirable
    performance on the minority class as well as the whole dataset. Using data
    augmentation techniques to increase the number of samples is one way to tackle this
    problem. We introduce a novel counterfactual data augmentation by verb replacement
    for the identification of medical claims. In addition, we investigate the impact of
