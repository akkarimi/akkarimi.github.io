- title: "Explainable Hallucination through Natural Language Inference Mapping"
  authors: "WF Chen, Z Zhao, A Karimi, L Flek"
  venue: "Findings of ACL"
  badge: "ACL Findings"
  year: 2025
  type: findings
  topics: [reasoning]
  selected: false
  summary: >-
    We introduce HaluMap, a training-free, model-agnostic framework that detects
    hallucinations by mapping NLI entailment and contradiction relations between inputs
    and outputs, outperforming other training-free NLI-based methods by five points with
    interpretable explanations.
  links:
    pdf: https://aclanthology.org/2025.findings-acl.96.pdf
    doi: 10.18653/v1/2025.findings-acl.96
    code: https://github.com/caisa-lab/acl25-halumap
  abstract: >-
    Large language models (LLMs) often generate hallucinated content, making it crucial
    to identify and quantify inconsistencies in their outputs. We introduce HaluMap, a
    post-hoc framework that detects hallucinations by mapping entailment and
    contradiction relations between source inputs and generated outputs using a natural
    language inference (NLI) model. To improve reliability, we propose a calibration
    step leveraging intra-text relations to refine predictions. HaluMap outperforms
    state-of-the-art NLI-based methods by five percentage points compared to other
    training-free approaches, while providing clear, interpretable explanations. As a
    training-free and model-agnostic approach, HaluMap offers a practical solution for
    verifying LLM outputs across diverse NLP tasks. The resources of this paper are
    available at https://github.com/caisa-lab/acl25-halumap.
  bibtex: |
    @inproceedings{chen2025explainable,
      title = {Explainable Hallucination through Natural Language Inference Mapping},
      author = {Chen, Wei-Fan and Zhao, Zhixue and Karimi, Akbar and Flek, Lucie},
      booktitle = {Findings of the {A}ssociation for {C}omputational {L}inguistics: {ACL} 2025},
      pages = {1888--1896},
