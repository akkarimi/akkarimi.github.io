      title = {Label-Consistent Data Generation for Aspect-Based Sentiment Analysis Using {LLM} Agents},
      author = {Monfared, Mohammad Hossein Akbari and Flek, Lucie and Karimi, Akbar},
      booktitle = {The Proceedings for the 15th Workshop on Computational Approaches to Subjectivity, Sentiment Social Media Analysis ({WASSA} 2026)},
