      publisher = {European Language Resources Association},
      url = {https://aclanthology.org/2022.lrec-1.61/}
    }

- title: "Improving Localization for Semi-Supervised Object Detection"
  authors: "L Rossi, A Karimi, A Prati"
  venue: "ICIAP 2022"
  badge: "ICIAP"
  year: 2022
  type: conference
  topics: [vision]
  selected: false
  summary: >-
    We add a bounding box localization classification task to the Mean Teacher framework
    to better filter pseudo-labels, and show that box regression on unlabeled data helps
    as much as classification, improving SSOD on COCO by 1.14% AP.
  links:
    pdf: https://arxiv.org/pdf/2206.10186
    doi: 10.1007/978-3-031-06430-2_43
  abstract: >-
    Nowadays, Semi-Supervised Object Detection (SSOD) is a hot topic, since, while it is
    rather easy to collect images for creating a new dataset, labeling them is still an
    expensive and time-consuming task. One of the successful methods to take advantage
    of raw images on a Semi-Supervised Learning (SSL) setting is the Mean Teacher
    technique, where the operations of pseudo-labeling by the Teacher and the Knowledge
    Transfer from the Student to the Teacher take place simultaneously. However, the
    pseudo-labeling by thresholding is not the best solution since the confidence value
    is not strictly related to the prediction uncertainty, not permitting to safely
    filter predictions. In this paper, we introduce an additional classification task
    for bounding box localization to improve the filtering of the predicted bounding
    boxes and obtain higher quality on Student training. Furthermore, we empirically
    prove that bounding box regression on the unsupervised part can equally contribute
    to the training as much as category classification. Our experiments show that our
    IL-net (Improving Localization net) increases SSOD performance by 1.14% AP on COCO
    dataset in limited-annotation regime.
  bibtex: |
    @inproceedings{rossi2022improving,
      title = {Improving Localization for Semi-Supervised Object Detection},
      author = {Rossi, Leonardo and Karimi, Akbar and Prati, Andrea},
      booktitle = {Image Analysis and Processing – ICIAP 2022},
      pages = {516--527},
      year = {2022},
      publisher = {Springer International Publishing},
      doi = {10.1007/978-3-031-06430-2_43},
      url = {https://doi.org/10.1007/978-3-031-06430-2_43}
    }

- title: "Improving BERT Performance for Aspect-Based Sentiment Analysis"
  authors: "A Karimi, L Rossi, A Prati"
  venue: "ICNLSP 2021"
  badge: "ICNLSP"
  year: 2021
  type: conference
  topics: [sentiment]
  selected: false
  summary: >-
    We propose two simple modules, Parallel Aggregation and Hierarchical Aggregation, on
    top of BERT for Aspect Extraction and Aspect Sentiment Classification, improving
    performance without further training of the BERT model.
  links:
    pdf: https://aclanthology.org/2021.icnlsp-1.5.pdf
  abstract: >-
    Aspect-Based Sentiment Analysis (ABSA) studies the consumer opinion on the market
    products. It involves examining the type of sentiments as well as sentiment targets
    expressed in product reviews. Analyzing the language used in a review is a difficult
    task that requires a deep understanding of the language. In recent years, deep
    language models, such as BERT, have shown great progress in this regard. In this
    work, we propose two simple modules called Parallel Aggregation and Hierarchical
    Aggregation to be utilized on top of BERT for two main ABSA tasks namely Aspect
    Extraction (AE) and Aspect Sentiment Classification (ASC) in order to improve the
    model's performance. We show that applying the proposed models eliminates the need
    for further training of the BERT model. The source code is available on the Web for
    further research and reproduction of the results.
