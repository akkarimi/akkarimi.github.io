- title: "Encoder Fine-tuning with Stochastic Sampling Outperforms Open-weight GPT in Astronomy Knowledge Extraction"
  authors: "S Rawat, L Flek, A Karimi"
  venue: "WASP Workshop @ IJCNLP-AACL 2025"
  badge: "AACL Workshop"
  year: 2025
  type: workshop
  topics: [science]
  selected: false
  summary: >-
    We build a multi-task SciBERT system for classifying telescope references, semantic
    attributes, and instrument mentions in astronomy papers, using stochastic segment
    sampling and majority voting, which significantly outperforms an open-weight GPT
    baseline.
  links:
    pdf: https://aclanthology.org/2025.wasp-main.22.pdf
    doi: 10.18653/v1/2025.wasp-main.22
  abstract: >-
    Scientific literature in astronomy is rapidly expanding, making it increasingly
    important to automate the extraction of key entities and contextual information from
    research papers. In this paper, we present an encoder-based system for extracting
    knowledge from astronomy articles. Our objective is to develop models capable of
    classifying telescope references, detecting auxiliary semantic attributes, and
    recognizing instrument mentions from textual content. To this end, we implement a
    multi-task transformer-based system built upon the SciBERT model and fine-tuned for
    astronomy corpora classification. To carry out the fine-tuning, we stochastically
    sample segments from the training data and use majority voting over the test
    segments at inference time. Our system, despite its simplicity and low-cost
    implementation, significantly outperforms the open-weight GPT baseline.
