- title: "More Agents Improve Math Problem Solving but Adversarial Robustness Gap Persists"
  authors: "K Alavi, Z Yeltay, L Flek, A Karimi"
  venue: "Findings of ACL 2026"
  badge: "ACL Findings"
  year: 2026
  type: findings
  topics: [robustness]
  selected: true
  summary: >-
    We evaluate multi-agent sampling-and-voting on adversarially perturbed math
    questions across six open-source models and four benchmarks, finding that more
    agents reliably improve accuracy while the robustness gap to noise, especially
    human-like typos, persists regardless of agent count.
  links:
    pdf: https://aclanthology.org/2026.findings-acl.2158.pdf
    doi: 10.18653/v1/2026.findings-acl.2158
  abstract: >-
    When LLM agents work together, they seem to be more powerful than a single LLM in
    mathematical question answering. However, are they also more robust to adversarial
    inputs? We investigate this question using adversarially perturbed math questions.
    These perturbations include punctuation noise with three intensities (10%, 30%,
    50%), plus real-world and human-like typos (WikiTypo, R2ATA). Using a unified
    sampling-and-voting framework (Agent Forest), we evaluate six open-source models
    (Qwen3-4B/14B, Llama3.1-8B, Mistral-7B, Gemma3-4B/12B) across four benchmarks
    (GSM8K, MATH, MMLU-Math, MultiArith), with various numbers of agents n = {1, 2, 5,
    10, 15, 20, 25}. Our findings show that 1) Noise type matters: punctuation noise
    harm scales with its severity, and the human typos remain the dominant bottleneck,
    yielding the largest gaps to Clean accuracy and the highest attack success rate
    (ASR) even with a large number of agents; 2) Collaboration reliably improves
    accuracy as the number of agents, n, increases, with the largest gains from n=1 to
    n=5 and diminishing returns beyond n≈10. However, the adversarial robustness gap
    persists regardless of the agent count.
  bibtex: |
    @inproceedings{alavi2026more,
      title = {More Agents Improve Math Problem Solving but Adversarial Robustness Gap Persists},
      author = {Alavi, Khashayar and Yeltay, Zhastay and Flek, Lucie and Karimi, Akbar},
      booktitle = {Findings of the {A}ssociation for {C}omputational {L}inguistics: {ACL} 2026},
      pages = {43457--43475},
      year = {2026},
      month = jul,
      address = {San Diego, California, United States},
      publisher = {Association for Computational Linguistics},
      doi = {10.18653/v1/2026.findings-acl.2158},
      url = {https://aclanthology.org/2026.findings-acl.2158/}
    }

- title: "MiniFool: Physics-Constraint-Aware Minimizer-Based Adversarial Attacks in Deep Neural Networks"
  authors: "L Flek, O Janik, PA Jung, A Karimi, T Saala, A Schmidt, M Schott, P Soldin, M Thiesmeyer, C Wiebusch, U Willemsen"
  venue: "The European Physical Journal C"
  badge: "EPJ C"
  year: 2026
  type: journal
  topics: [science, robustness]
  selected: true
  summary: >-
    We present MiniFool, a physics-inspired adversarial attack that minimizes a χ²-based
    test statistic combined with a target-score deviation, testing the robustness of
    neural network classifiers on IceCube, CMS, and MNIST data, including unlabeled
    experimental data.
  links:
    pdf: https://link.springer.com/content/pdf/10.1140/epjc/s10052-026-15773-2.pdf
    doi: 10.1140/epjc/s10052-026-15773-2
  abstract: >-
    In this paper, we present a new algorithm, MiniFool, that implements
    physics-inspired adversarial attacks for testing neural network-based classification
    tasks in particle and astroparticle physics. While we initially developed the
    algorithm for the search for astrophysical tau neutrinos with the IceCube Neutrino
    Observatory, we apply it to further data from other science domains, thus
    demonstrating its general applicability. Here, we apply the algorithm to the
    well-known MNIST data set and furthermore, to public data from the CMS Experiment at
    the Large Hadron Collider. The algorithm is based on minimizing a cost function that
    combines a χ² based test-statistic with the deviation from the desired target score.
    The test statistic quantifies the probability of the perturbations applied to the
    data based on the experimental uncertainties. For our studied use cases, we find
    that the likelihood of a flipped classification differs for both the initially
    correctly and incorrectly classified events. When testing changes of the
    classifications as a function of an attack parameter that scales the experimental
    uncertainties, the robustness of the network decision can be assessed. Furthermore,
    this allows testing the robustness of the classification of unlabeled experimental
    data.
  bibtex: |
    @article{flek2026minifool,
      title = {MiniFool: Physics-Constraint-Aware Minimizer-Based Adversarial Attacks in Deep Neural Networks},
      author = {Flek, Lucie and Janik, Oliver and Jung, Philipp Alexander and Karimi, Akbar and Saala, Timo and Schmidt, Alexander and Schott, Matthias and Soldin, Philipp and Thiesmeyer, Matthias and Wiebusch, Christopher and Willemsen, Ulrich},
      journal = {The European Physical Journal C},
      volume = {86},
      number = {6},
      year = {2026},
      month = jun,
      publisher = {Springer Science and Business Media LLC},
      doi = {10.1140/epjc/s10052-026-15773-2},
      url = {https://doi.org/10.1140/epjc/s10052-026-15773-2}
    }

- title: "Can LLM Agents Identify Spoken Dialects like a Linguist?"
  authors: "T Bystrich, L Hamm, MH Akhter, L Fischbach, L Flek, A Karimi"
  venue: "DialRes Workshop @ LREC 2026"
  badge: "LREC Workshop"
  year: 2026
  type: workshop
  topics: [dialects]
  selected: false
  summary: >-
    We explore whether LLM agents can classify Swiss German dialects from ASR-generated
    phonetic transcriptions combined with linguistic resources such as dialect feature
    maps, vowel history, and rules, comparing them against HuBERT, an LLM baseline, and
    a human linguist.
  links:
    pdf: https://aclanthology.org/2026.dialres-1.8.pdf
    doi: 10.63317/27m2tbgjcat8
  abstract: >-
    Due to the scarcity of labeled dialectal speech, audio dialect classification is a
    challenging task for most languages, including Swiss German. In this work, we
    explore the ability of large language models (LLMs) as agents in understanding the
    dialects and whether they can show comparable performance to models such as HuBERT
    in dialect classification. In addition, we provide an LLM baseline and a human
    linguist one. Our approach uses phonetic transcriptions produced by ASR systems and
    combines them with linguistic resources such as dialect feature maps, vowel history,
    and rules. Our findings indicate that, when linguistic information is provided, the
    LLM predictions improve. The human baseline shows that automatically generated
    transcriptions can be beneficial for such classifications, but also present
    opportunities for improvement.
  bibtex: |
    @inproceedings{bystrich2026llm,
      title = {Can {LLM} Agents Identify Spoken Dialects like a Linguist?},
      author = {Bystrich, Tobias and Hamm, Lukas and Akhter, Maria Hassan and Fischbach, Lea and Flek, Lucie and Karimi, Akbar},
      booktitle = {Proceedings of the First Workshop on Dialects in {NLP} {---} A Resource Perspective},
      pages = {83--92},
      year = {2026},
      month = may,
      address = {Palma de Mallorca},
      publisher = {Association for Computational Linguistics},
      doi = {10.63317/27m2tbgjcat8},
      url = {https://aclanthology.org/2026.dialres-1.8/}
    }

- title: "Speaker Normalization via Voice Conversion Reveals a Human–Machine Dissociation in Dialect Classification"
  authors: "C Kleen, L Fischbach, A Karimi, L Flek, A Lameli"
  venue: "DialRes Workshop @ LREC 2026"
  badge: "LREC Workshop"
  year: 2026
  type: workshop
  topics: [dialects, augmentation]
  selected: false
  summary: >-
    In perception experiments on nine German dialect regions, we show that voice
    conversion to a single target speaker leaves human dialect recognition unchanged
    while significantly improving a deep learning model, revealing a divergence between
    human and machine speech processing.
  links:
    pdf: https://aclanthology.org/2026.dialres-1.18.pdf
    doi: 10.63317/3sqk7nxsikhp
  abstract: >-
    This study evaluates whether Retrieval-based Voice Conversion (RVC) can be used to
    normalize speaker-specific variability while preserving dialect-relevant acoustic
    cues, and what the response of human and machine systems to this manipulation
    reveals about the architecture of dialect recognition. In two perception
    experiments, speech samples from nine German dialect regions were presented either
    in their original form or after conversion to a single target speaker. We compared
    overall accuracy, confusion structures, item-level response distributions, and the
    interaction between listener origin and target dialect across conditions. Human
    classification remained stable under voice conversion. Accuracy did not differ
    between conditions, confusion matrices were highly correlated, and item-level
    divergences were minimal. The interaction between listener origin and target
    dialect—reflecting systematic regional bias—remained invariant. These findings
    indicate that RVC does not distort perceptually relevant dialectal cues and that
    human dialect recognition is robust to speaker normalization. In contrast, we
    evaluated a deep learning model under matched conditions: model accuracy improved
    significantly under RVC, while human performance remained unchanged. This
    dissociation reframes RVC as an experimental probe for investigating the divergence
    between human and machine speech processing, suggesting that this divergence is
    rooted in fundamentally different representational architectures.
  bibtex: |
    @inproceedings{kleen2026speaker,
      title = {Speaker Normalization via Voice Conversion Reveals a Human-Machine Dissociation in Dialect Classification},
      author = {Kleen, Caroline and Fischbach, Lea and Karimi, Akbar and Flek, Lucie and Lameli, Alfred},
      booktitle = {Proceedings of the First Workshop on Dialects in {NLP} {---} A Resource Perspective},
      pages = {177--187},
      year = {2026},
      month = may,
      address = {Palma de Mallorca},
      publisher = {Association for Computational Linguistics},
      doi = {10.63317/3sqk7nxsikhp},
      url = {https://aclanthology.org/2026.dialres-1.18/}
    }

- title: "Shapes are not enough: CONSERVAttack and its use for finding vulnerabilities and uncertainties in machine learning applications"
  authors: "P Bechtle, L Flek, PA Jung, A Karimi, T Saala, A Schmidt, M Schott, P Soldin, C Wiebusch, U Willemsen"
  venue: "The European Physical Journal C"
  badge: "EPJ C"
  year: 2026
  type: journal
  topics: [science, robustness]
  selected: false
  summary: >-
    We propose CONSERVAttack, an adversarial attack whose perturbations stay within
    simulation-versus-data uncertainty bounds, evading standard validation checks in
    high energy physics while fooling the model, and discuss strategies to mitigate such
    vulnerabilities.
  links:
    pdf: https://link.springer.com/content/pdf/10.1140/epjc/s10052-026-16351-2.pdf
    doi: 10.1140/epjc/s10052-026-16351-2
    arxiv: https://arxiv.org/abs/2603.13970
  abstract: >-
    In High Energy Physics, as in many other fields of science, the application of
    machine learning techniques has been crucial in advancing our understanding of
    fundamental phenomena. Increasingly, deep learning models are applied to analyze
    both simulated and experimental data. In most experiments, a rigorous regime of
    testing for physically motivated systematic uncertainties is in place. The numerical
    evaluation of these tests for differences between the data on the one side and
    simulations on the other side quantifies the effect of potential sources of
    mismodelling on the machine learning output. In addition, thorough comparisons of
    marginal distributions and (linear) feature correlations between data and simulation
    in "control regions" are applied. However, the guidance by physical motivation, and
    the need to constrain comparisons to specific regions, does not guarantee that all
    possible sources of deviations have been accounted for. We therefore propose a new
    adversarial attack - the CONSERVAttack - designed to exploit the remaining space of
    hypothetical deviations between simulation and data after the above mentioned tests.
    The resulting adversarial perturbations are consistent within the uncertainty bounds
    - evading standard validation checks - while successfully fooling the underlying
    model. We further propose strategies to mitigate such vulnerabilities and argue that
    robustness to adversarial effects must be considered when interpreting results from
    deep learning in particle physics.
  bibtex: |
    @article{bechtle2026shapes,
      title = {Shapes are not enough: CONSERVAttack and its use for finding vulnerabilities and uncertainties in machine learning applications},
      author = {Bechtle, Philip and Flek, Lucie and Jung, Philipp Alexander and Karimi, Akbar and Saala, Timo and Schmidt, Alexander and Schott, Matthias and Soldin, Philipp and Wiebusch, Christopher and Willemsen, Ulrich},
      journal = {The European Physical Journal C},
      volume = {86},
      number = {10},
      pages = {1172},
      year = {2026},
      month = oct,
      publisher = {Springer},
      doi = {10.1140/epjc/s10052-026-16351-2},
      url = {https://doi.org/10.1140/epjc/s10052-026-16351-2}
    }

- title: "Label-Consistent Data Generation for Aspect-Based Sentiment Analysis Using LLM Agents"
  authors: "MHA Monfared, L Flek, A Karimi"
  venue: "WASSA Workshop @ EACL 2026"
  badge: "EACL Workshop"
  year: 2026
  type: workshop
  topics: [augmentation, sentiment]
  selected: false
  summary: >-
    We propose an agentic data augmentation method for Aspect-Based Sentiment Analysis
    (ABSA) that uses iterative generation and verification to produce high-quality
    synthetic training examples.
  links:
    pdf: https://aclanthology.org/2026.wassa-1.17.pdf
    doi: 10.18653/v1/2026.wassa-1.17
  abstract: >-
    We propose an agentic data augmentation method for Aspect-Based Sentiment Analysis
    (ABSA) that uses iterative generation and verification to produce high-quality
    synthetic training examples. To isolate the effect of agentic structure, we also
    develop a closely matched prompting-based baseline using the same model and
    instructions. Both methods are evaluated across three ABSA subtasks—Aspect Term
    Extraction (ATE), Aspect Sentiment Classification (ATSC), and Aspect Sentiment Pair
    Extraction (ASPE)—four SemEval datasets, and two encoder–decoder models: T5-Base and
    Tk-Instruct. Our results show that the agentic augmentation outperforms raw
    prompting in label preservation of the augmented data, especially when the tasks
    require aspect term generation. In addition, when combined with real data, agentic
    augmentation provides higher gains, consistently outperforming prompting-based
    generation. These benefits are most pronounced for T5-Base, while the more heavily
    pretrained Tk-Instruct exhibits smaller improvements. As a result, augmented data
    helps T5-Base achieve comparable performance with its counterpart.
