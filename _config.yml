# ─────────────────────────────────────────────────────────────────────
#  Site settings
#  You rarely need to touch this file. Content lives in _data/*.yml —
#  see README.md ("How to update your site").
#  After editing this file, restart `jekyll serve` (it is not reloaded).
# ─────────────────────────────────────────────────────────────────────

title: "Akbar Karimi"
description: >-
  Akbar Karimi is a postdoctoral researcher at the Spoken Language Systems (LSV)
  group, Saarland University, working on chemical and protein language models,
  trustworthy AI for drug discovery, and the robustness of large language models.
url: "https://akkarimi.com"
baseurl: ""
lang: en
timezone: Europe/Berlin

# ── About you (used in the header, footer, hero and search-engine data) ──
author:
  name: "Akbar Karimi"
  job_title: "Postdoctoral Researcher"
  # How your name is written in publication author lists; these get bolded.
  publication_names: ["A Karimi"]
  photo: "/images/ak.jpeg"
  email: "ak.karimi@live.com"
  affiliation:
    group: "Spoken Language Systems (LSV)"
    group_url: "https://www.lsv.uni-saarland.de/"
    institution: "Saarland University"
    institution_url: "https://www.uni-saarland.de/en/home.html"
  # Profile links. Leave a value empty to hide its icon.
  links:
    scholar: "https://scholar.google.com/citations?user=_qroDmEAAAAJ&hl=en"
    orcid: "https://orcid.org/0000-0002-5132-2435"
    github: "https://github.com/akkarimi"
    linkedin: ""   # e.g. "https://www.linkedin.com/in/your-handle/"

# Image shown when the site is shared on social media / chat apps.
og_image: "/images/ak-480.jpg"

# ── Build ─────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
permalink: pretty

include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - LICENSE
  - vendor
  - .bundle
  - .venv
  - .sass-cache
  - .jekyll-cache
  - .claude
  # ── TEMPORARY: remaining old template files, kept out of the build until deleted.
  - images/3953273590_704e3899d5_m.jpg
  - images/500x300.png
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/editing-talk.png
  - images/foo-bar-identity.jpg
  - images/foo-bar-identity-th.jpg
  - images/homepage.png
  - images/image-alignment-1200x4002.jpg
  - images/image-alignment-150x150.jpg
  - images/image-alignment-300x200.jpg
  - images/image-alignment-580x300.jpg
  - images/paragraph-indent.png
  - images/paragraph-no-indent.png
  - images/profile.png
  - images/site-logo.png
  - images/browserconfig.xml
  - images/manifest.json
  - images/safari-pinned-tab.svg
  - images/mstile-70x70.png
  - images/mstile-144x144.png
  - images/mstile-150x150.png
  - images/mstile-310x150.png
  - images/mstile-310x310.png
  - _pages/about.md
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html

plugins:
  - jekyll-sitemap

defaults:
  - scope: { path: "" }
    values: { layout: page }
