{%- assign a = site.author -%}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__id">
      <p class="site-footer__name">{{ a.name }}</p>
      <p class="site-footer__aff">
        {{ a.job_title }} · <a href="{{ a.affiliation.group_url }}">{{ a.affiliation.group }}</a>,
        <a href="{{ a.affiliation.institution_url }}">{{ a.affiliation.institution }}</a>
      </p>
    </div>
    {% include profile-links.html class="profile-links--footer" %}
    <p class="site-footer__meta">
      © <span data-current-year>{{ site.time | date: "%Y" }}</span> {{ a.name }}
      <span aria-hidden="true">·</span> Last updated {{ site.time | date: "%B %Y" }}
    </p>
  </div>
</footer>
