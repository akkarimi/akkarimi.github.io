{%- comment -%} schema.org Person — helps search engines connect this site to your profiles. {%- endcomment -%}
{%- assign a = site.author -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ a.name | jsonify }},
  "url": {{ site.url | jsonify }},
  "image": {{ "/images/ak-480.jpg" | absolute_url | jsonify }},
  "email": {{ "mailto:" | append: a.email | jsonify }},
  "jobTitle": {{ a.job_title | jsonify }},
  "description": {{ site.description | strip_newlines | jsonify }},
  "worksFor": {
    "@type": "Organization",
    "name": {{ a.affiliation.group | append: ", " | append: a.affiliation.institution | jsonify }},
    "url": {{ a.affiliation.group_url | jsonify }},
    "parentOrganization": { "@type": "CollegeOrUniversity", "name": {{ a.affiliation.institution | jsonify }}, "url": {{ a.affiliation.institution_url | jsonify }} }
  },
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "University of Parma" },
  "knowsAbout": [{% for t in site.data.research %}{{ t.title | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}],
  "sameAs": [{% assign first = true %}{% for l in a.links %}{% if l[1] != "" and l[1] %}{% unless first %}, {% endunless %}{{ l[1] | jsonify }}{% assign first = false %}{% endif %}{% endfor %}]
}
</script>
